{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Campus Gym{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'gym/site.css' %}" />
  </head>
  <body>
    <header class="top">
      <a class="mark" href="{% url 'home' %}">Campus Gym</a>
      <nav>
        <a href="{% url 'home' %}" {% if page == "home" %}aria-current="page"{% endif %}>Home</a>
        <a href="{% url 'library' %}" {% if page == "library" %}aria-current="page"{% endif %}>Library</a>
        <a href="{% url 'gym_setup' %}" {% if page == "gym" %}aria-current="page"{% endif %}>Gym</a>
        <a href="{% url 'routines' %}" {% if page == "routines" %}aria-current="page"{% endif %}>Routines</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
